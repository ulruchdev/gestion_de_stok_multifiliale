# ============================================================
# StockMaster CM — Configuration principale
# Référence : GS-CDCT-2026-01
# ============================================================

server:
  port: 8080

spring:
  application:
    name: stockmaster-cm

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockmaster_dev}
    username: ${DB_USERNAME:stockmaster}
    password: ${DB_PASSWORD:stockmaster}
    driver-class-name: org.postgresql.Driver

  # ========== JPA / Hibernate ==========
  jpa:
    hibernate:
      ddl-auto: none           # Désactivé — Flyway gère les migrations !
    show-sql: false
    open-in-view: false        # ← DÉSACTIVÉ explicitement (évite LazyInitializationException silencieuse)
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  # ========== Flyway ==========
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    clean-disabled: true

  # ========== Jackson ==========
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
    time-zone: UTC
    default-property-inclusion: non-null

  # ========== Mail ==========
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# ========== Actuator ==========
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# ========== StockMaster — Propriétés personnalisées ==========
stockmaster:
  jwt:
    secret: ${JWT_SECRET:U3RvY2tNYXN0ZXItQ00tZGV2LWp3dC1zZWNyZXQtMjAyNi1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1wbGVhc2U=}
    access-token-expiration: 900
    refresh-token-expiration: 604800
    issuer: stockmaster
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    max-age: 3600
  pagination:
    default-page-size: 20
    max-page-size: 100
    default-sort: dateCreation,desc

  # ========== Rate Limiting ==========
  # Toutes les valeurs sont pilotées exclusivement par variables d'environnement
  # (jamais de nombre en dur ici) — voir .env.example pour la liste complète.
  # Les valeurs par défaut ci-dessous sont les seuils de sécurité réels, pas des
  # valeurs de test/debug : ne jamais les remplacer par des nombres en dur.
  rate-limiting:
    enabled: ${RATE_LIMIT_ENABLED:true}
    global:
      enabled: ${RATE_LIMIT_GLOBAL_ENABLED:true}
      max-requests: ${RATE_LIMIT_GLOBAL_MAX_REQUESTS:100}
      window-seconds: ${RATE_LIMIT_GLOBAL_WINDOW_SECONDS:60}
    endpoints:
      login:
        uri: /api/v1/auth/login
        max-attempts: ${RATE_LIMIT_LOGIN_MAX_ATTEMPTS:5}
        window-seconds: ${RATE_LIMIT_LOGIN_WINDOW_SECONDS:900}
      refresh:
        uri: /api/v1/auth/refresh
        max-attempts: ${RATE_LIMIT_REFRESH_MAX_ATTEMPTS:5}
        window-seconds: ${RATE_LIMIT_REFRESH_WINDOW_SECONDS:900}
      inscription-entreprise-unique:
        uri: /api/v1/auth/inscription/entreprise-unique
        max-attempts: ${RATE_LIMIT_INSCRIPTION_ENTREPRISE_MAX_ATTEMPTS:3}
        window-seconds: ${RATE_LIMIT_INSCRIPTION_ENTREPRISE_WINDOW_SECONDS:3600}
      inscription-groupe:
        uri: /api/v1/auth/inscription/groupe
        max-attempts: ${RATE_LIMIT_INSCRIPTION_GROUPE_MAX_ATTEMPTS:3}
        window-seconds: ${RATE_LIMIT_INSCRIPTION_GROUPE_WINDOW_SECONDS:3600}
      forgot-password:
        uri: /api/v1/auth/forgot-password
        max-attempts: ${RATE_LIMIT_FORGOT_PASSWORD_MAX_ATTEMPTS:3}
        window-seconds: ${RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:900}
      reset-password:
        uri: /api/v1/auth/reset-password
        max-attempts: ${RATE_LIMIT_RESET_PASSWORD_MAX_ATTEMPTS:3}
        window-seconds: ${RATE_LIMIT_RESET_PASSWORD_WINDOW_SECONDS:900}
      change-password:
        uri: /api/v1/auth/change-password
        max-attempts: ${RATE_LIMIT_CHANGE_PASSWORD_MAX_ATTEMPTS:5}
        window-seconds: ${RATE_LIMIT_CHANGE_PASSWORD_WINDOW_SECONDS:900}

# ========== Logging ==========
logging:
  level:
    root: INFO
    com.stockmaster: DEBUG
    org.springframework: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
# ============================================================
# Profil : dev
# ============================================================
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockmaster_dev}
    username: ${DB_USERNAME:stockmaster}
    password: ${DB_PASSWORD:stockmaster}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: StockMasterPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate    # Valide que le schéma correspond aux entités

  flyway:
    enabled: true
    clean-disabled: false   # Autorisé en dev pour tests

logging:
  level:
    com.stockmaster: DEBUG
    org.springframework.web: DEBUG

---
# ============================================================
# Profil : test
# ============================================================
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:postgresql://localhost:5432/stockmaster_dev
    username: stockmaster
    password: stockmaster
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

stockmaster:
  jwt:
    secret: U3RvY2tNYXN0ZXItQ00tZGV2LWp3dC1zZWNyZXQtMjAyNi1jaGFuZ2UtaW4tcHJvZHVjdGlvbi1wbGVhc2U=

management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.stockmaster: DEBUG

---
# ============================================================
# Profil : prod
# ============================================================
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: StockMasterPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 10000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true
    clean-disabled: true    # ← JAMAIS flyway:clean en prod

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

logging:
  level:
    root: WARN
    com.stockmaster: INFO
